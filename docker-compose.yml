# Mini Vercel: local platform.
#
#   docker compose up -d                  # infra only (Postgres, Redis, S3 storage)
#   docker compose --profile app up -d    # + api, worker, edge, dashboard
#
name: mini-vercel

x-app-env: &app-env
  MV_DATABASE_URL: postgres://minivercel:minivercel@postgres:5432/minivercel?sslmode=disable
  MV_REDIS_ADDR: redis:6379
  MV_S3_ENDPOINT: http://s3:8333
  MV_S3_ACCESS_KEY: minivercel
  MV_S3_SECRET_KEY: minivercel-secret
  MV_S3_BUCKET: deployments
  MV_ROOT_DOMAIN: ${MV_ROOT_DOMAIN:-localhost}
  MV_PUBLIC_SCHEME: ${MV_PUBLIC_SCHEME:-http}
  MV_PUBLIC_PORT: ${MV_PUBLIC_PORT:-8080}
  MV_ENCRYPTION_KEY: ${MV_ENCRYPTION_KEY:-6d696e692d76657263656c2d6465762d6b65792d33322d62797465732d212121}
  MV_API_TOKEN: ${MV_API_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minivercel
      POSTGRES_PASSWORD: minivercel
      POSTGRES_DB: minivercel
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minivercel"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # S3-compatible object storage for local dev (Cloudflare R2 in production).
  # SeaweedFS is used because MinIO no longer publishes public images.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    ports: ["9000:8333"]
    volumes:
      - s3data:/data
      - ./deploy/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  api:
    profiles: [app]
    build: { context: ., dockerfile: deploy/Dockerfile, target: api }
    environment:
      <<: *app-env
      MV_DASHBOARD_DIR: /srv/dashboard
      MV_CORS_ORIGINS: http://localhost:3000,http://localhost:4000
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: deploy/Dockerfile, target: worker }
    environment:
      <<: *app-env
      MV_WORKER_CONCURRENCY: "2"
    # The worker talks to the host Docker daemon to create build sandboxes.
    # Build containers themselves NEVER get the socket.
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    deploy: { replicas: 1 }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  edge:
    profiles: [app]
    build: { context: ., dockerfile: deploy/Dockerfile, target: edge }
    environment: *app-env
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  s3data:
